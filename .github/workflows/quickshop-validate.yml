name: QuickShop frontend validation

on:
  push:
    branches:
      - 'release/quickshop-final-20261014'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tv-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
